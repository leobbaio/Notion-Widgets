<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relógio</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg-outer: #191919;
    --bg-widget: #202020;
    --text-default: #D4D4D4;
    --text-secondary: #9B9B9B;
    --text-muted: #6B6B6B;
    --border-color: rgba(255, 255, 255, 0.08);
    --hover-bg: rgba(255, 255, 255, 0.055);
    --active-bg: rgba(255, 255, 255, 0.09);
    --txt-color: #D4D4D4;
    --font-stack: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  html, body { height: 100%; width: 100%; overflow: hidden; background: var(--bg-outer); font-family: var(--font-stack); }

  .widget-stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: var(--bg-outer); overflow: hidden; }

  .clock-widget {
    width: 280px; height: 160px;
    background: var(--bg-outer);
    border: none;
    box-shadow: none;
    display: flex; flex-direction: column;
    color: var(--text-default);
    flex-shrink: 0;
    transform-origin: center center;
    position: relative;
  }

  .widget-header { display: flex; align-items: center; justify-content: flex-end; padding: 10px 10px 0 10px; flex-shrink: 0; }

  .icon-btn {
    width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    background: transparent; border: none; border-radius: 4px;
    color: var(--txt-color); cursor: pointer;
    transition: background 0.1s ease, color 0.1s ease;
  }
  .icon-btn:hover { background: var(--hover-bg); }
  .icon-btn:active { background: var(--active-bg); }
  .icon-btn svg { width: 14px; height: 14px; display: block; pointer-events: none; }

  .clock-body {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 0 12px 12px 12px;
    margin-top: -8px;
  }

  .time {
    font-size: 52px;
    font-weight: 700;
    color: var(--txt-color);
    letter-spacing: 1px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .date {
    font-size: 13px;
    font-weight: 400;
    color: var(--txt-color);
    opacity: 0.7;
    margin-top: 10px;
    letter-spacing: 0.2px;
  }

  .dropdown {
    position: absolute; z-index: 20;
    background: #2A2A2A;
    border: 1px solid var(--border-color); border-radius: 8px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
    padding: 8px 6px; display: none;
  }
  .dropdown.open { display: block; }

  #colorMenu { top: 38px; right: 10px; width: 176px; }
  .menu-section-label { font-size: 11px; color: var(--text-muted); padding: 4px 8px 6px 8px; font-weight: 500; }
  .swatch-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 0 4px 4px 4px; }
  .swatch-cell {
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 5px; cursor: pointer;
    border: 1px solid var(--border-color);
    font-size: 14px; font-weight: 600;
    transition: transform 0.08s ease, border-color 0.1s ease;
  }
  .swatch-cell:hover { border-color: rgba(255, 255, 255, 0.35); transform: scale(1.06); }
  .swatch-cell.selected { border-color: var(--text-default); border-width: 2px; }

  #errbar {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: #BE524B; color: #fff;
    font-family: monospace; font-size: 11px;
    padding: 4px 8px; display: none; z-index: 999;
    white-space: pre-wrap; word-break: break-word;
  }
</style>
</head>
<body>

  <div class="widget-stage" id="stage">
    <div class="clock-widget" id="widget">

      <div class="widget-header">
        <button class="icon-btn" id="colorBtn" type="button" aria-label="Cor">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2.5s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"></path>
          </svg>
        </button>
      </div>

      <div class="dropdown" id="colorMenu">
        <div class="menu-section-label">Text color</div>
        <div class="swatch-grid" id="textGrid"></div>
      </div>

      <div class="clock-body">
        <div class="time" id="time">00:00</div>
        <div class="date" id="date">—</div>
      </div>

    </div>
  </div>

  <div id="errbar"></div>

<script>
window.addEventListener("DOMContentLoaded", function () {
  try {
    "use strict";

    var DEFAULT_TXT = "#D4D4D4";

    var TEXT_COLORS = [
      { name: "Default", value: "#D4D4D4" }, { name: "Gray", value: "#9B9B9B" },
      { name: "Brown", value: "#A27763" }, { name: "Orange", value: "#CB7B37" },
      { name: "Yellow", value: "#C19138" }, { name: "Green", value: "#4F9768" },
      { name: "Blue", value: "#447ACB" }, { name: "Purple", value: "#865DBB" },
      { name: "Pink", value: "#BA4A78" }, { name: "Red", value: "#BE524B" }
    ];

    var MONTHS = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

    var mem = {};
    function store(key, val) {
      if (val === undefined) {
        try { var v = localStorage.getItem(key); return v !== null ? v : (key in mem ? mem[key] : null); }
        catch (e) { return key in mem ? mem[key] : null; }
      } else {
        try { localStorage.setItem(key, val); } catch (e) { mem[key] = val; }
      }
    }

    var txtColor = store("clock_txt") || DEFAULT_TXT;

    var timeEl = document.getElementById("time");
    var dateEl = document.getElementById("date");
    var colorBtn = document.getElementById("colorBtn");
    var colorMenu = document.getElementById("colorMenu");
    var textGrid = document.getElementById("textGrid");

    function pad(n) { return n < 10 ? "0" + n : String(n); }

    function tick() {
      var now = new Date();
      timeEl.textContent = pad(now.getHours()) + ":" + pad(now.getMinutes());
      dateEl.textContent = now.getDate() + " de " + MONTHS[now.getMonth()] + " de " + now.getFullYear();
    }

    function applyColor() {
      document.documentElement.style.setProperty("--txt-color", txtColor);
    }

    TEXT_COLORS.forEach(function (c) {
      var cell = document.createElement("div");
      cell.className = "swatch-cell";
      cell.style.color = c.value;
      cell.textContent = "A";
      cell.title = c.name;
      cell.setAttribute("data-value", c.value);
      cell.addEventListener("click", function (e) {
        e.stopPropagation();
        txtColor = c.value;
        store("clock_txt", txtColor);
        applyColor(); mark();
      });
      textGrid.appendChild(cell);
    });

    function mark() {
      var cells = textGrid.children;
      for (var i = 0; i < cells.length; i++) {
        cells[i].classList.toggle("selected", cells[i].getAttribute("data-value") === txtColor);
      }
    }

    colorBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      var open = !colorMenu.classList.contains("open");
      colorMenu.classList.toggle("open", open);
      if (open) mark();
    });
    colorMenu.addEventListener("click", function (e) { e.stopPropagation(); });
    document.addEventListener("click", function () { colorMenu.classList.remove("open"); });

    var stage = document.getElementById("stage");
    var widget = document.getElementById("widget");
    function fit() {
      var s = Math.min(stage.clientWidth / 280, stage.clientHeight / 160);
      if (!isFinite(s) || s <= 0) s = 1;
      widget.style.transform = "scale(" + s + ")";
    }
    window.addEventListener("resize", fit);
    if (window.ResizeObserver) { new ResizeObserver(fit).observe(stage); }

    applyColor();
    tick();
    setInterval(tick, 1000);
    fit();

  } catch (err) {
    var bar = document.getElementById("errbar");
    if (bar) { bar.style.display = "block"; bar.textContent = "Erro: " + (err && err.message ? err.message : err); }
  }
});
</script>

</body>
</html>
