<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clima</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg-outer: #191919;
    --text-default: #D4D4D4;
    --text-secondary: #9B9B9B;
    --text-muted: #6B6B6B;
    --border-color: rgba(255, 255, 255, 0.08);
    --hover-bg: rgba(255, 255, 255, 0.055);
    --active-bg: rgba(255, 255, 255, 0.09);
    --card-bg: rgba(255, 255, 255, 0.035);
    --txt-color: #D4D4D4;
    --font-stack: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  html, body { height: 100%; width: 100%; overflow: hidden; background: transparent; font-family: var(--font-stack); }

  .widget-stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: transparent; overflow: hidden; }

  .weather-widget {
    width: 340px; height: 330px;
    background: var(--bg-outer);
    border: none; box-shadow: none;
    display: flex; flex-direction: column;
    color: #D4D4D4;
    flex-shrink: 0;
    transform-origin: center center;
    position: relative;
    padding: 12px 14px;
  }

  /* HEADER */
  .weather-header {
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0; margin-bottom: 8px;
  }
  .city-name { font-size: 15px; font-weight: 600; color: var(--txt-color); }
  .header-controls { display: flex; align-items: center; gap: 2px; }
  .icon-btn {
    width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    background: transparent; border: none; border-radius: 4px;
    color: #9B9B9B; cursor: pointer;
    font-size: 14px; line-height: 1;
    transition: background 0.1s ease;
  }
  .icon-btn svg { color: var(--txt-color); }
  .icon-btn:hover { background: var(--hover-bg); }
  .icon-btn:active { background: var(--active-bg); }
  .icon-btn svg { width: 13px; height: 13px; display: block; pointer-events: none; }

  /* TOPO: atual (esq) + previsão 7 dias (dir) */
  .weather-main { display: flex; gap: 8px; flex: 1; min-height: 0; }

  .current {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    width: 112px; flex-shrink: 0;
    text-align: center;
    overflow: visible;
  }
  .current-icon { width: 52px; height: 52px; margin-bottom: 6px; color: var(--txt-color); cursor: default; overflow: visible; }
  .current-icon svg { overflow: visible; display: block; }
  .current-temp { font-size: 28px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; color: var(--txt-color); white-space: nowrap; }

  .forecast {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column;
    justify-content: center;
    gap: 2px;
    padding-right: 6px;
  }
  .forecast-row {
    display: flex; align-items: center; gap: 7px;
    font-size: 11px; padding: 1px 0;
  }
  .forecast-row .fc-temps { margin-left: auto; }
  .fc-day { color: var(--text-secondary); width: 74px; display: flex; gap: 5px; flex-shrink: 0; }
  .fc-wd { width: 30px; display: inline-block; }
  .fc-date { color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .fc-moon { display: flex; align-items: center; flex-shrink: 0; cursor: default; }
  .fc-moon svg { width: 12px; height: 12px; color: var(--txt-color); display: block; }
  .fc-icon { width: 14px; height: 14px; color: var(--txt-color); flex-shrink: 0; cursor: default; display: flex; align-items: center; }
  .fc-temps { display: flex; gap: 6px; font-variant-numeric: tabular-nums; }
  .fc-max { color: #D4D4D4; }
  .fc-min { color: #D4D4D4; opacity: 0.5; }

  /* LINHA: lua + chuva */
  .weather-extra {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 11px; color: var(--text-secondary);
    padding: 6px 0; flex-shrink: 0;
    border-top: 1px solid var(--border-color);
    margin-top: 6px;
  }
  .extra-item { display: flex; align-items: center; gap: 5px; }
  .extra-item svg { width: 13px; height: 13px; color: var(--txt-color); }

  /* QUADRO: sensação, vento, umidade */
  .weather-stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px;
    flex-shrink: 0;
  }
  .stat-box {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 6px 3px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    cursor: default;
  }
  .stat-ico { display: flex; align-items: center; }
  .stat-ico svg { width: 15px; height: 15px; color: var(--txt-color); display: block; }
  .stat-value { font-size: 10.5px; font-weight: 600; color: #D4D4D4; font-variant-numeric: tabular-nums; text-align: center; line-height: 1.1; }

  .loading { display: flex; align-items: center; justify-content: center; flex: 1; color: var(--text-muted); font-size: 12px; }

  .dropdown {
    position: absolute; z-index: 20;
    top: 34px; right: 14px; width: 176px;
    background: #2A2A2A;
    border: 1px solid var(--border-color); border-radius: 8px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
    padding: 8px 6px; display: none;
  }
  .dropdown.open { display: block; }
  .menu-section-label { font-size: 11px; color: var(--text-muted); padding: 4px 8px 6px 8px; font-weight: 500; }
  .swatch-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 0 4px 4px 4px; }
  .swatch-cell {
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 5px; cursor: pointer;
    border: 1px solid var(--border-color);
    font-size: 14px; font-weight: 600;
    transition: transform 0.08s ease, border-color 0.1s ease;
  }
  .swatch-cell:hover { border-color: rgba(255, 255, 255, 0.35); transform: scale(1.06); }
  .swatch-cell.selected { border-color: var(--text-default); border-width: 2px; }

  #errbar {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: #BE524B; color: #fff;
    font-family: monospace; font-size: 11px;
    padding: 4px 8px; display: none; z-index: 999;
    white-space: pre-wrap; word-break: break-word;
  }

  /* ===== ANIMAÇÕES DOS ÍCONES DE TEMPO ===== */
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes floatX { 0%,100% { transform: translateX(-1.5px); } 50% { transform: translateX(1.5px); } }
  @keyframes rainDrop { 0% { transform: translateY(-2px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(3px); opacity: 0; } }
  @keyframes flash { 0%,45%,55%,100% { opacity: 1; } 48%,52% { opacity: 0.2; } }
  @keyframes fogSlide { 0%,100% { transform: translateX(-1px); } 50% { transform: translateX(1px); } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }

  /* sol girando */
  .wx-sun-rays { transform-origin: 12px 12px; animation: pulse 2.5s ease-in-out infinite; }
  /* nuvem flutuando */
  .wx-cloud-anim { animation: floatX 3s ease-in-out infinite; }
  /* gotas de chuva caindo */
  .wx-rain-drops path { animation: rainDrop 1.1s linear infinite; }
  .wx-rain-drops path:nth-child(2) { animation-delay: 0.35s; }
  .wx-rain-drops path:nth-child(3) { animation-delay: 0.7s; }
  /* raio piscando */
  .wx-bolt { animation: flash 2.4s ease-in-out infinite; }
  /* neblina deslizando */
  .wx-fog path { animation: fogSlide 3s ease-in-out infinite; }
  /* estrela/lua pulsando (não usado nos de tempo, reservado) */
</style>
</head>
<body>

  <div class="widget-stage" id="stage">
    <div class="weather-widget" id="widget">

      <div class="weather-header">
        <div class="city-name" id="cityName">—</div>
        <div class="header-controls">
          <button class="icon-btn" id="prevBtn" type="button" aria-label="Cidade anterior">&#8249;</button>
          <button class="icon-btn" id="nextBtn" type="button" aria-label="Próxima cidade">&#8250;</button>
          <button class="icon-btn" id="colorBtn" type="button" aria-label="Cor">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"></path></svg>
          </button>
        </div>
      </div>

      <div class="dropdown" id="colorMenu">
        <div class="menu-section-label">Text color</div>
        <div class="swatch-grid" id="textGrid"></div>
      </div>

      <div id="content" style="display:flex; flex-direction:column; flex:1; min-height:0;">
        <div class="loading" id="loading">Carregando…</div>
      </div>

    </div>
  </div>

  <div id="errbar"></div>

<script>
window.addEventListener("DOMContentLoaded", function () {
  try {
    "use strict";

    var DEFAULT_TXT = "#D4D4D4";
    var TEXT_COLORS = [
      { name: "Default", value: "#D4D4D4" }, { name: "Gray", value: "#9B9B9B" },
      { name: "Brown", value: "#A27763" }, { name: "Orange", value: "#CB7B37" },
      { name: "Yellow", value: "#C19138" }, { name: "Green", value: "#4F9768" },
      { name: "Blue", value: "#447ACB" }, { name: "Purple", value: "#865DBB" },
      { name: "Pink", value: "#BA4A78" }, { name: "Red", value: "#BE524B" }
    ];

    var CITIES = [
      { name: "Itápolis", lat: -21.5964, lon: -48.8111 },
      { name: "Mirassol", lat: -20.8189, lon: -49.5208 },
      { name: "São José do Rio Preto", lat: -20.8081, lon: -49.3811 },
      { name: "Votuporanga", lat: -20.4239, lon: -49.9781 }
    ];

    var WEEKDAYS = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
    var MOON_PHASES = ["Lua Nova","Lua Crescente","Lua Cheia","Lua Minguante"];

    var mem = {};
    function store(key, val) {
      if (val === undefined) {
        try { var v = localStorage.getItem(key); return v !== null ? v : (key in mem ? mem[key] : null); }
        catch (e) { return key in mem ? mem[key] : null; }
      } else {
        try { localStorage.setItem(key, val); } catch (e) { mem[key] = val; }
      }
    }

    var txtColor = store("weather_txt") || DEFAULT_TXT;
    var cityIdx = parseInt(store("weather_city"), 10);
    if (!isFinite(cityIdx) || cityIdx < 0 || cityIdx >= CITIES.length) cityIdx = 0;

    var cityNameEl = document.getElementById("cityName");
    var contentEl = document.getElementById("content");
    var colorBtn = document.getElementById("colorBtn");
    var colorMenu = document.getElementById("colorMenu");
    var textGrid = document.getElementById("textGrid");

    function applyColor() { document.documentElement.style.setProperty("--txt-color", txtColor); }

    /* ===== Ícones SVG por código WMO ===== */
    function weatherIcon(code, size) {
      var s = size || 24;
      var sunDisc = '<circle cx="12" cy="12" r="5"></circle>';
      var sunRays = '<g class="wx-sun-rays"><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"></path></g>';
      var sun = sunRays + sunDisc;
      var cloud = '<g class="wx-cloud"><path d="M17.5 19a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.6 1.5A4 4 0 0 0 6 19z"></path></g>';
      var rain = cloud + '<g class="wx-rain-drops"><path d="M8 20v1.5"></path><path d="M12 20v1.5"></path><path d="M16 20v1.5"></path></g>';
      var snow = cloud + '<g class="wx-rain-drops"><path d="M8 20h.01"></path><path d="M12 20h.01"></path><path d="M16 20h.01"></path></g>';
      var storm = cloud + '<path class="wx-bolt" d="M13 18l-3 4h4l-3 4"></path>';
      var fog = '<g class="wx-fog"><path d="M4 9h16"></path><path d="M4 13h16"></path><path d="M4 17h16"></path><path d="M6 5h12"></path></g>';
      var partly = '<g><path d="M8 1.5v1.5M2.5 8H1M3.8 3.8l1 1M12.2 3.8l-1 1"></path></g><circle cx="8" cy="8" r="3.2"></circle><g><path d="M18 20a3.5 3.5 0 0 0 0-7 5 5 0 0 0-9.6 1.2A3.2 3.2 0 0 0 9 20z"></path></g>';
      // predominantemente limpo: sol grande protagonista + nuvenzinha pequena discreta no canto
      var mostlyClear = '<g><path d="M10 2v2M2 10H0.5M17.5 10H16M4 4l1.2 1.2M16 4l-1.2 1.2M4 16l1.2-1.2"></path></g><circle cx="10" cy="10" r="4"></circle><g><path d="M19 21a2.6 2.6 0 0 0 0-5.2 3.6 3.6 0 0 0-6.9 0.9A2.4 2.4 0 0 0 12.5 21z"></path></g>';
      var inner;
      if (code === 0) inner = sun;
      else if (code === 1) inner = mostlyClear;
      else if (code === 2) inner = partly;
      else if (code === 3) inner = cloud;
      else if (code >= 45 && code <= 48) inner = fog;
      else if (code >= 51 && code <= 67) inner = rain;
      else if (code >= 71 && code <= 77) inner = snow;
      else if (code >= 80 && code <= 82) inner = rain;
      else if (code >= 95) inner = storm;
      else inner = cloud;
      return '<svg viewBox="0 0 24 24" width="'+s+'" height="'+s+'" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'+inner+'</svg>';
    }

    function weatherDesc(code) {
      if (code === 0) return "Céu limpo";
      if (code === 1) return "Predominantemente limpo";
      if (code === 2) return "Parcialmente nublado";
      if (code === 3) return "Nublado";
      if (code >= 45 && code <= 48) return "Neblina";
      if (code >= 51 && code <= 57) return "Garoa";
      if (code >= 61 && code <= 67) return "Chuva";
      if (code >= 71 && code <= 77) return "Neve";
      if (code >= 80 && code <= 82) return "Pancadas de chuva";
      if (code >= 95) return "Tempestade";
      return "—";
    }

    /* ===== Fase da lua (aproximação) ===== */
    function moonPhaseData(date) {
      var lp = 2551443; // período sinódico em segundos
      var now = date.getTime() / 1000;
      var newMoon = new Date(Date.UTC(1970,0,7,20,35,0)).getTime()/1000;
      var phase = ((now - newMoon) % lp) / lp;
      if (phase < 0) phase += 1;
      // 4 fases principais: 0=Nova, 1=Crescente, 2=Cheia, 3=Minguante
      var idx;
      if (phase < 0.125 || phase >= 0.875) idx = 0;       // Nova
      else if (phase < 0.375) idx = 1;                     // Crescente
      else if (phase < 0.625) idx = 2;                     // Cheia
      else idx = 3;                                        // Minguante
      return { name: MOON_PHASES[idx], icon: moonIcon(idx) };
    }

    function seasonData(date) {
      var m = date.getMonth() + 1; // 1-12
      var d = date.getDate();
      // Hemisfério Sul (datas aproximadas dos solstícios/equinócios)
      // Verão: 21/12 - 20/03 | Outono: 20/03 - 21/06 | Inverno: 21/06 - 23/09 | Primavera: 23/09 - 21/12
      var name, icon;
      var afterOrEq = function(mm, dd) { return (m > mm) || (m === mm && d >= dd); };
      if (afterOrEq(12,21) || !afterOrEq(3,20)) { name = "Verão"; icon = seasonIcon("summer"); }
      else if (!afterOrEq(6,21)) { name = "Outono"; icon = seasonIcon("autumn"); }
      else if (!afterOrEq(9,23)) { name = "Inverno"; icon = seasonIcon("winter"); }
      else { name = "Primavera"; icon = seasonIcon("spring"); }
      return { name: name, icon: icon };
    }

    function seasonIcon(key) {
      var a = 'viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"';
      if (key === "summer") { // sol
        return '<svg '+a+'><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.4 1.4M17.6 17.6L19 19M5 19l1.4-1.4M17.6 6.4L19 5"></path></svg>';
      } else if (key === "autumn") { // folha (leaf oficial Lucide)
        return '<svg '+a+'><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z"></path><path d="M2 21c0-3 1.85-5.36 5.08-6"></path></svg>';
      } else if (key === "winter") { // floco de neve com ramificações
        return '<svg '+a+'><path d="M12 2v20"/><path d="M12 6l3-2.2M12 6L9 3.8M12 18l3 2.2M12 18l-3 2.2"/><path d="M3.4 7l17.2 10"/><path d="M3.4 7l0.3 3.7M3.4 7l3.5-1.2M20.6 17l-0.3-3.7M20.6 17l-3.5 1.2"/><path d="M20.6 7L3.4 17"/><path d="M20.6 7l-3.5-1.2M20.6 7l-0.3 3.7M3.4 17l3.5 1.2M3.4 17l0.3-3.7"/></svg>';
      } else { // spring — flor (flower oficial Lucide)
        return '<svg '+a+'><circle cx="12" cy="12" r="3"/><path d="M12 16.5A4.5 4.5 0 1 1 7.5 12 4.5 4.5 0 1 1 12 7.5a4.5 4.5 0 1 1 4.5 4.5 4.5 4.5 0 1 1-4.5 4.5"/><path d="M12 7.5V9"/><path d="M7.5 12H9"/><path d="M16.5 12H15"/><path d="M12 16.5V15"/><path d="m8 8 1.88 1.88"/><path d="M14.12 9.88 16 8"/><path d="m8 16 1.88-1.88"/><path d="M14.12 14.12 16 16"/></svg>';
      }
    }

    function moonIcon(idx) {
      // ícones distintos por fase (14px)
      var attrs = 'viewBox="0 0 24 24" width="13" height="13"';
      if (idx === 0) { // Nova — círculo contornado, vazio
        return '<svg '+attrs+' fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"></circle></svg>';
      } else if (idx === 1) { // Crescente — metade direita cheia
        return '<svg '+attrs+' fill="currentColor"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"></circle><path d="M12 3a9 9 0 0 1 0 18z"></path></svg>';
      } else if (idx === 2) { // Cheia — círculo preenchido
        return '<svg '+attrs+' fill="currentColor"><circle cx="12" cy="12" r="9"></circle></svg>';
      } else { // Minguante — metade esquerda cheia
        return '<svg '+attrs+' fill="currentColor"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"></circle><path d="M12 3a9 9 0 0 0 0 18z"></path></svg>';
      }
    }

    /* ===== Buscar dados da Open-Meteo ===== */
    function loadWeather() {
      var city = CITIES[cityIdx];
      cityNameEl.textContent = city.name;
      contentEl.innerHTML = '<div class="loading">Carregando…</div>';

      var url = "https://api.open-meteo.com/v1/forecast" +
        "?latitude=" + city.lat + "&longitude=" + city.lon +
        "&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code,precipitation_probability" +
        "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,sunrise,sunset" +
        "&timezone=America%2FSao_Paulo&forecast_days=7";

      fetch(url).then(function (r) { return r.json(); }).then(function (data) {
        render(data);
      }).catch(function (err) {
        contentEl.innerHTML = '<div class="loading">Erro ao carregar clima</div>';
      });
    }

    function render(data) {
      var cur = data.current;
      var daily = data.daily;

      var temp = Math.round(cur.temperature_2m);
      var feels = Math.round(cur.apparent_temperature);
      var hum = Math.round(cur.relative_humidity_2m);
      var wind = Math.round(cur.wind_speed_10m);
      var code = cur.weather_code;
      var rainProb = daily.precipitation_probability_max ? daily.precipitation_probability_max[0] : cur.precipitation_probability;
      if (rainProb == null) rainProb = 0;

      var moonData = moonPhaseData(new Date());
      var seasonInfo = seasonData(new Date());
      var precipSum = (daily.precipitation_sum && daily.precipitation_sum[0] != null) ? daily.precipitation_sum[0] : 0;
      var sunrise = (daily.sunrise && daily.sunrise[0]) ? daily.sunrise[0].split("T")[1] : "--:--";
      var sunset = (daily.sunset && daily.sunset[0]) ? daily.sunset[0].split("T")[1] : "--:--";

      var html = '';
      html += '<div class="weather-main">';
      // Atual
      html += '<div class="current">';
      html += '<div class="current-icon" title="' + weatherDesc(code) + '">' + weatherIcon(code, 56) + '</div>';
      html += '<div class="current-temp">' + temp + '°C</div>';
      html += '</div>';
      // Previsão 7 dias
      html += '<div class="forecast">';
      for (var i = 0; i < daily.time.length; i++) {
        var d = new Date(daily.time[i] + "T12:00:00");
        var dd = (d.getDate() < 10 ? "0" : "") + d.getDate();
        var mm = ((d.getMonth()+1) < 10 ? "0" : "") + (d.getMonth()+1);
        var wname = (i === 0) ? "Hoje" : WEEKDAYS[d.getDay()];
        var dayMoon = moonPhaseData(d);
        html += '<div class="forecast-row">';
        html += '<span class="fc-day"><span class="fc-wd">' + wname + '</span><span class="fc-date">' + dd + '/' + mm + '</span></span>';
        html += '<span class="fc-moon" title="' + dayMoon.name + '">' + dayMoon.icon + '</span>';
        html += '<span class="fc-icon" title="' + weatherDesc(daily.weather_code[i]) + '">' + weatherIcon(daily.weather_code[i], 14) + '</span>';
        html += '<span class="fc-temps"><span class="fc-max">' + Math.round(daily.temperature_2m_max[i]) + '°C</span>';
        html += '<span class="fc-min">' + Math.round(daily.temperature_2m_min[i]) + '°C</span></span>';
        html += '</div>';
      }
      html += '</div>';
      html += '</div>';

      // Quadro 2x2: chuva, sensação, vento, umidade (ícone + valor, nome no hover)
      var ICO = {
        rain: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 15a4.5 4.5 0 0 0 0-9 6 6 0 0 0-11.6 1.5A4 4 0 0 0 6 15z"></path><path d="M8 18l-1 2M12 18l-1 2M16 18l-1 2"></path></svg>',
        precip: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v2"></path><path d="M3 12a9 9 0 0 1 18 0z"></path><path d="M12 12v7a2.5 2.5 0 0 0 5 0"></path></svg>',
        wind: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10a2.5 2.5 0 1 0-2.5-2.5M3 16h13a2.5 2.5 0 1 1-2.5 2.5M3 12h16a2.5 2.5 0 1 0-2.5-2.5"></path></svg>',
        hum: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"></path><path d="M12 16a2.5 2.5 0 0 1-2.5-2.5"></path></svg>',
        feels: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 14.76V5a2 2 0 0 0-4 0v9.76a4 4 0 1 0 4 0z"></path></svg>',
        sunrise: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17 18a5 5 0 0 0-10 0M12 2v7M8 6l4-4 4 4M3 18h2M19 18h2M4.5 11.5l1 1M19.5 11.5l-1 1M1 22h22"></path></svg>',
        sunset: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17 18a5 5 0 0 0-10 0M12 9V2M8 5l4 4 4-4M3 18h2M19 18h2M4.5 11.5l1 1M19.5 11.5l-1 1M1 22h22"></path></svg>'
      };
      // Linha 1: chuva, vento, sensação, nascer  |  Linha 2: precip, umidade, estação, pôr
      html += '<div class="weather-stats">';
      html += '<div class="stat-box" title="Chance de chuva"><span class="stat-ico">' + ICO.rain + '</span><span class="stat-value">' + rainProb + '%</span></div>';
      html += '<div class="stat-box" title="Velocidade do Vento"><span class="stat-ico">' + ICO.wind + '</span><span class="stat-value">' + wind + '</span></div>';
      html += '<div class="stat-box" title="Sensação térmica"><span class="stat-ico">' + ICO.feels + '</span><span class="stat-value">' + feels + '°C</span></div>';
      html += '<div class="stat-box" title="Nascer do sol"><span class="stat-ico">' + ICO.sunrise + '</span><span class="stat-value">' + sunrise + '</span></div>';
      html += '<div class="stat-box" title="Precipitação acumulada"><span class="stat-ico">' + ICO.precip + '</span><span class="stat-value">' + precipSum + 'mm</span></div>';
      html += '<div class="stat-box" title="Umidade"><span class="stat-ico">' + ICO.hum + '</span><span class="stat-value">' + hum + '%</span></div>';
      html += '<div class="stat-box" title="Estação do ano"><span class="stat-ico">' + seasonInfo.icon + '</span><span class="stat-value">' + seasonInfo.name + '</span></div>';
      html += '<div class="stat-box" title="Pôr do sol"><span class="stat-ico">' + ICO.sunset + '</span><span class="stat-value">' + sunset + '</span></div>';
      html += '</div>';

      contentEl.innerHTML = html;
    }

    /* ===== Navegação de cidade ===== */
    document.getElementById("prevBtn").addEventListener("click", function () {
      cityIdx = (cityIdx - 1 + CITIES.length) % CITIES.length;
      store("weather_city", String(cityIdx));
      loadWeather();
    });
    document.getElementById("nextBtn").addEventListener("click", function () {
      cityIdx = (cityIdx + 1) % CITIES.length;
      store("weather_city", String(cityIdx));
      loadWeather();
    });

    /* ===== Menu de cor ===== */
    TEXT_COLORS.forEach(function (col) {
      var cell = document.createElement("div");
      cell.className = "swatch-cell";
      cell.style.color = col.value;
      cell.textContent = "A";
      cell.title = col.name;
      cell.setAttribute("data-value", col.value);
      cell.addEventListener("click", function (e) {
        e.stopPropagation();
        txtColor = col.value;
        store("weather_txt", txtColor);
        applyColor(); mark();
      });
      textGrid.appendChild(cell);
    });
    function mark() {
      var cells = textGrid.children;
      for (var i = 0; i < cells.length; i++) {
        cells[i].classList.toggle("selected", cells[i].getAttribute("data-value") === txtColor);
      }
    }
    colorBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      var open = !colorMenu.classList.contains("open");
      colorMenu.classList.toggle("open", open);
      if (open) mark();
    });
    colorMenu.addEventListener("click", function (e) { e.stopPropagation(); });
    document.addEventListener("click", function () { colorMenu.classList.remove("open"); });

    /* ===== Escala ===== */
    var stage = document.getElementById("stage");
    var widget = document.getElementById("widget");
    function fit() {
      var s = Math.min(stage.clientWidth / 340, stage.clientHeight / 330);
      if (!isFinite(s) || s <= 0) s = 1;
      widget.style.transform = "scale(" + s + ")";
    }
    window.addEventListener("resize", fit);
    if (window.ResizeObserver) { new ResizeObserver(fit).observe(stage); }

    applyColor();
    loadWeather();
    fit();

  } catch (err) {
    var bar = document.getElementById("errbar");
    if (bar) { bar.style.display = "block"; bar.textContent = "Erro: " + (err && err.message ? err.message : err); }
  }
});
</script>

</body>
</html>
