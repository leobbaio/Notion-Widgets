<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hidratação</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg-outer: #191919;
    --bg-widget: #202020;
    --text-default: #D4D4D4;
    --text-secondary: #9B9B9B;
    --text-muted: #6B6B6B;
    --border-color: rgba(255, 255, 255, 0.08);
    --hover-bg: rgba(255, 255, 255, 0.055);
    --active-bg: rgba(255, 255, 255, 0.09);
    --txt-color: #D4D4D4;
    --bg-color: #252525;
    --font-stack: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  html, body { height: 100%; width: 100%; overflow: hidden; background: var(--bg-outer); font-family: var(--font-stack); }

  .widget-stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: var(--bg-outer); overflow: hidden; }

  .hydration-widget {
    width: 280px; height: 300px;
    background: var(--bg-outer);
    border: none;
    box-shadow: none;
    display: flex; flex-direction: column;
    color: var(--text-default);
    flex-shrink: 0;
    transform-origin: center center;
    position: relative;
  }

  .widget-header { display: flex; align-items: center; justify-content: flex-end; gap: 2px; padding: 10px 10px 4px 10px; flex-shrink: 0; }

  .icon-btn {
    width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    background: transparent; border: none; border-radius: 4px;
    color: var(--txt-color); cursor: pointer;
    transition: background 0.1s ease, color 0.1s ease;
  }
  .icon-btn:hover { background: var(--hover-bg); }
  .icon-btn:active { background: var(--active-bg); }
  .icon-btn svg { width: 14px; height: 14px; display: block; pointer-events: none; }

  .widget-body { flex: 1; display: flex; align-items: center; justify-content: center; padding: 4px 0 2px 0; }

  .bottle {
    position: relative; width: 92px; height: 150px;
    border: 2px solid var(--text-secondary); border-radius: 26px;
    overflow: hidden; background: rgba(255, 255, 255, 0.02);
  }

  .liquid {
    position: absolute; left: 0; right: 0; bottom: 0; height: 0%;
    background: var(--bg-color);
    transition: height 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    opacity: 0.92;
  }

  /* Camada das ondas na superfície do líquido */
  .wave {
    position: absolute;
    top: -8px;            /* sobe um pouco acima da lâmina d'água */
    left: 0;
    width: 200%;          /* dobro da largura para o loop deslizar sem emenda */
    height: 14px;
    fill: var(--bg-color);
  }
  .wave.back {
    opacity: 0.55;
    animation: waveMove 3.2s linear infinite;
  }
  .wave.front {
    opacity: 1;
    animation: waveMove 2.1s linear infinite reverse;
  }
  @keyframes waveMove {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }

  .liquid.empty .wave { display: none; }

  .readout { text-align: center; font-size: 14px; font-weight: 500; color: var(--txt-color); padding: 2px 0 8px 0; flex-shrink: 0; letter-spacing: 0.2px; }
  .readout .sep { color: var(--text-muted); margin: 0 3px; }
  .readout .pct { display: block; font-size: 11px; font-weight: 400; color: var(--txt-color); opacity: 0.7; margin-top: 2px; }

  .controls { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 12px 14px 12px; flex-shrink: 0; }

  .amount-input {
    width: 74px; height: 30px;
    background: var(--bg-color);
    border: 1px solid var(--border-color); border-radius: 6px;
    color: var(--txt-color);
    font-family: var(--font-stack); font-size: 13px; text-align: center;
    outline: none; transition: border-color 0.1s ease;
  }
  .amount-input::placeholder { color: var(--txt-color); opacity: 0.4; }
  .amount-input:focus { border-color: rgba(255, 255, 255, 0.2); }
  .amount-input::-webkit-outer-spin-button, .amount-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .amount-input[type=number] { -moz-appearance: textfield; }

  .op-btn {
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg-color);
    border: 1px solid var(--border-color); border-radius: 6px;
    color: var(--txt-color); cursor: pointer;
    font-family: var(--font-stack); font-size: 18px; line-height: 1;
    transition: filter 0.1s ease;
  }
  .op-btn:hover { filter: brightness(1.25); }
  .op-btn:active { filter: brightness(0.9); }

  .dropdown {
    position: absolute; z-index: 20;
    background: #2A2A2A;
    border: 1px solid var(--border-color); border-radius: 8px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
    padding: 6px; display: none;
  }
  .dropdown.open { display: block; }

  #goalMenu { top: 38px; right: 10px; width: 172px; }
  .goal-label { font-size: 11px; color: var(--text-secondary); padding: 2px 4px 6px 4px; }
  .goal-input-row { display: flex; gap: 6px; }
  .goal-input {
    flex: 1; min-width: 0; width: 90px; height: 30px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border-color); border-radius: 6px;
    color: var(--text-default); font-family: var(--font-stack); font-size: 13px; text-align: center; outline: none;
  }
  .goal-input:focus { border-color: rgba(255,255,255,0.2); }
  .goal-input::-webkit-outer-spin-button, .goal-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .goal-input[type=number] { -moz-appearance: textfield; }
  .goal-save {
    height: 30px; padding: 0 10px; flex-shrink: 0;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border-color); border-radius: 6px;
    color: var(--text-default); cursor: pointer;
    font-family: var(--font-stack); font-size: 12px;
  }
  .goal-save:hover { background: var(--hover-bg); }

  #colorMenu { top: 38px; right: 10px; width: 176px; padding: 8px 6px; }
  .menu-section-label { font-size: 11px; color: var(--text-muted); padding: 4px 8px 6px 8px; font-weight: 500; }
  .swatch-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 0 4px 4px 4px; }
  .swatch-cell {
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 5px; cursor: pointer;
    border: 1px solid var(--border-color);
    font-size: 14px; font-weight: 600;
    transition: transform 0.08s ease, border-color 0.1s ease;
  }
  .swatch-cell:hover { border-color: rgba(255, 255, 255, 0.35); transform: scale(1.06); }
  .swatch-cell.selected { border-color: var(--text-default); border-width: 2px; }
  .menu-divider { height: 1px; background: var(--border-color); margin: 6px 4px; }

  #errbar {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: #BE524B; color: #fff;
    font-family: monospace; font-size: 11px;
    padding: 4px 8px; display: none; z-index: 999;
    white-space: pre-wrap; word-break: break-word;
  }
</style>
</head>
<body>

  <div class="widget-stage" id="stage">
    <div class="hydration-widget" id="widget">

      <div class="widget-header">
        <button class="icon-btn" id="goalBtn" type="button" aria-label="Definir meta">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="9"></circle>
            <circle cx="12" cy="12" r="4.5"></circle>
          </svg>
        </button>
        <button class="icon-btn" id="colorBtn" type="button" aria-label="Cores">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2.5s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"></path>
          </svg>
        </button>
      </div>

      <div class="dropdown" id="goalMenu">
        <div class="goal-label">Meta do dia (ml)</div>
        <div class="goal-input-row">
          <input type="number" class="goal-input" id="goalInput" min="1" step="50">
          <button class="goal-save" id="goalSave" type="button">OK</button>
        </div>
      </div>

      <div class="dropdown" id="colorMenu">
        <div class="menu-section-label">Text color</div>
        <div class="swatch-grid" id="textGrid"></div>
        <div class="menu-divider"></div>
        <div class="menu-section-label">Background color</div>
        <div class="swatch-grid" id="bgGrid"></div>
      </div>

      <div class="widget-body">
        <div class="bottle"><div class="liquid" id="liquid">
            <svg class="wave back" viewBox="0 0 120 14" preserveAspectRatio="none">
              <path d="M0 7 Q 15 0 30 7 T 60 7 T 90 7 T 120 7 V14 H0 Z"></path>
            </svg>
            <svg class="wave front" viewBox="0 0 120 14" preserveAspectRatio="none">
              <path d="M0 7 Q 15 14 30 7 T 60 7 T 90 7 T 120 7 V14 H0 Z"></path>
            </svg>
          </div></div>
      </div>

      <div class="readout">
        <span id="currentVal">0</span><span class="sep">/</span><span id="goalVal">3000</span> ml
        <span class="pct" id="pctVal">0%</span>
      </div>

      <div class="controls">
        <button class="op-btn" id="minusBtn" type="button" aria-label="Remover">&#8722;</button>
        <input type="number" class="amount-input" id="amountInput" placeholder="ml" min="0" step="50">
        <button class="op-btn" id="plusBtn" type="button" aria-label="Adicionar">&#43;</button>
      </div>

    </div>
  </div>

  <div id="errbar"></div>

<script>
window.addEventListener("DOMContentLoaded", function () {
  try {
    "use strict";

    var DEFAULT_GOAL = 3000;
    var DEFAULT_TXT = "#D4D4D4";
    var DEFAULT_BG = "#252525";

    var TEXT_COLORS = [
      { name: "Default", value: "#D4D4D4" }, { name: "Gray", value: "#9B9B9B" },
      { name: "Brown", value: "#A27763" }, { name: "Orange", value: "#CB7B37" },
      { name: "Yellow", value: "#C19138" }, { name: "Green", value: "#4F9768" },
      { name: "Blue", value: "#447ACB" }, { name: "Purple", value: "#865DBB" },
      { name: "Pink", value: "#BA4A78" }, { name: "Red", value: "#BE524B" }
    ];
    var BG_COLORS = [
      { name: "Default", value: "#252525" }, { name: "Gray", value: "#2F2F2F" },
      { name: "Brown", value: "#2E2724" }, { name: "Orange", value: "#36291F" },
      { name: "Yellow", value: "#372E20" }, { name: "Green", value: "#242B26" },
      { name: "Blue", value: "#1F282D" }, { name: "Purple", value: "#2A2430" },
      { name: "Pink", value: "#2E2328" }, { name: "Red", value: "#332523" }
    ];

    var mem = {};
    function store(key, val) {
      if (val === undefined) {
        try { var v = localStorage.getItem(key); return v !== null ? v : (key in mem ? mem[key] : null); }
        catch (e) { return key in mem ? mem[key] : null; }
      } else {
        try { localStorage.setItem(key, val); } catch (e) { mem[key] = val; }
      }
    }

    var goal = DEFAULT_GOAL, current = 0, txtColor = DEFAULT_TXT, bgColor = DEFAULT_BG;

    var liquidEl = document.getElementById("liquid");
    var currentValEl = document.getElementById("currentVal");
    var goalValEl = document.getElementById("goalVal");
    var pctValEl = document.getElementById("pctVal");
    var amountInput = document.getElementById("amountInput");
    var goalBtn = document.getElementById("goalBtn");
    var goalMenu = document.getElementById("goalMenu");
    var goalInput = document.getElementById("goalInput");
    var goalSave = document.getElementById("goalSave");
    var colorBtn = document.getElementById("colorBtn");
    var colorMenu = document.getElementById("colorMenu");
    var textGrid = document.getElementById("textGrid");
    var bgGrid = document.getElementById("bgGrid");
    var plusBtn = document.getElementById("plusBtn");
    var minusBtn = document.getElementById("minusBtn");

    function todayKey() { var d = new Date(); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }

    function load() {
      var g = parseFloat(store("hydration_goal"));
      goal = (isFinite(g) && g > 0) ? g : DEFAULT_GOAL;
      txtColor = store("hydration_txt") || DEFAULT_TXT;
      bgColor = store("hydration_bg") || DEFAULT_BG;
      if (store("hydration_date") === todayKey()) {
        var c = parseFloat(store("hydration_current"));
        current = (isFinite(c) && c > 0) ? c : 0;
      } else {
        current = 0; store("hydration_date", todayKey()); store("hydration_current", "0");
      }
    }

    function fmt(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, "."); }

    function render() {
      var pct = goal > 0 ? (current / goal) * 100 : 0;
      var clamped = Math.max(0, Math.min(100, pct));
      liquidEl.style.height = clamped + "%";
      if (clamped <= 0) { liquidEl.classList.add("empty"); } else { liquidEl.classList.remove("empty"); }
      document.documentElement.style.setProperty("--txt-color", txtColor);
      document.documentElement.style.setProperty("--bg-color", bgColor);
      currentValEl.textContent = fmt(current);
      goalValEl.textContent = fmt(goal);
      pctValEl.textContent = Math.round(pct) + "%";
    }

    function applyDelta(sign) {
      var v = parseFloat(amountInput.value);
      if (!isFinite(v) || v <= 0) return;
      current += sign * v;
      if (current < 0) current = 0;
      amountInput.value = "";
      store("hydration_current", String(current));
      store("hydration_date", todayKey());
      render();
    }

    plusBtn.addEventListener("click", function () { applyDelta(1); });
    minusBtn.addEventListener("click", function () { applyDelta(-1); });
    amountInput.addEventListener("keydown", function (e) { if (e.key === "Enter") applyDelta(1); });

    function closeGoal() { goalMenu.classList.remove("open"); }
    function closeColor() { colorMenu.classList.remove("open"); }

    goalBtn.addEventListener("click", function (e) {
      e.stopPropagation(); closeColor();
      var open = !goalMenu.classList.contains("open");
      goalMenu.classList.toggle("open", open);
      if (open) { goalInput.value = goal; goalInput.focus(); goalInput.select(); }
    });
    goalSave.addEventListener("click", function (e) {
      e.stopPropagation();
      var v = parseFloat(goalInput.value);
      if (isFinite(v) && v > 0) { goal = v; store("hydration_goal", String(goal)); render(); }
      closeGoal();
    });
    goalInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { goalSave.click(); }
    });
    goalMenu.addEventListener("click", function (e) { e.stopPropagation(); });

    TEXT_COLORS.forEach(function (c) {
      var cell = document.createElement("div");
      cell.className = "swatch-cell";
      cell.style.color = c.value;
      cell.textContent = "A";
      cell.title = c.name;
      cell.setAttribute("data-value", c.value);
      cell.addEventListener("click", function (e) {
        e.stopPropagation(); txtColor = c.value;
        store("hydration_txt", txtColor); render(); mark();
      });
      textGrid.appendChild(cell);
    });
    BG_COLORS.forEach(function (c) {
      var cell = document.createElement("div");
      cell.className = "swatch-cell";
      cell.style.background = c.value;
      cell.title = c.name;
      cell.setAttribute("data-value", c.value);
      cell.addEventListener("click", function (e) {
        e.stopPropagation(); bgColor = c.value;
        store("hydration_bg", bgColor); render(); mark();
      });
      bgGrid.appendChild(cell);
    });

    function mark() {
      var i, cells = textGrid.children;
      for (i = 0; i < cells.length; i++) cells[i].classList.toggle("selected", cells[i].getAttribute("data-value") === txtColor);
      cells = bgGrid.children;
      for (i = 0; i < cells.length; i++) cells[i].classList.toggle("selected", cells[i].getAttribute("data-value") === bgColor);
    }

    colorBtn.addEventListener("click", function (e) {
      e.stopPropagation(); closeGoal();
      var open = !colorMenu.classList.contains("open");
      colorMenu.classList.toggle("open", open);
      if (open) mark();
    });
    colorMenu.addEventListener("click", function (e) { e.stopPropagation(); });

    document.addEventListener("click", function () { closeGoal(); closeColor(); });

    var stage = document.getElementById("stage");
    var widget = document.getElementById("widget");
    function fit() {
      var s = Math.min(stage.clientWidth / 280, stage.clientHeight / 300);
      if (!isFinite(s) || s <= 0) s = 1;
      widget.style.transform = "scale(" + s + ")";
    }
    window.addEventListener("resize", fit);
    if (window.ResizeObserver) { new ResizeObserver(fit).observe(stage); }

    load();
    render();
    fit();

  } catch (err) {
    var bar = document.getElementById("errbar");
    if (bar) { bar.style.display = "block"; bar.textContent = "Erro: " + (err && err.message ? err.message : err); }
  }
});
</script>

</body>
</html>
